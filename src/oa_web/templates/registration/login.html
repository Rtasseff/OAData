{% extends "oa_web/base.html" %}
{% block title %}Sign in — OA Archive Tracker{% endblock %}
{% block content %}
<div class="login">
  <h1>Sign in</h1>
  <div class="card">
    {% if form.errors %}<div class="msg error">That username and password did not match.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <p><label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus required autocomplete="username"></p>
      <p><label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required autocomplete="current-password"></p>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
