{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OA Archive Tracker{% endblock %}</title>
<link rel="stylesheet" href="{% static 'oa_web/style.css' %}">
</head>
<body>
<header class="top"><div class="inner">
  <a class="brand" href="{% url 'papers' %}">OA Archive Tracker</a>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'papers' %}" class="{% if nav == 'papers' %}on{% endif %}">Papers</a>
    <a href="{% url 'actions' %}" class="{% if nav == 'actions' %}on{% endif %}">Actions</a>
    <a href="{% url 'report' %}" class="{% if nav == 'report' %}on{% endif %}">Report</a>
    <a href="{% url 'history' %}" class="{% if nav == 'history' %}on{% endif %}">History</a>
  </nav>
  <div class="user">
    <span>{{ user.get_username }}</span>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
  </div>
  {% endif %}
</div></header>
<main class="inner">
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
